name: 每日更新频道列表

on:
  schedule:
    # 北京时间每天 04:00（UTC 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 抓取上游源
        run: python scripts/fetch.py

      - name: 有效性检测（仅 IPv4 可用）
        run: python scripts/check.py

      - name: 分类并生成 m3u
        run: python scripts/build.py

      - name: 提交更新
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          # 精简为 CCTV 专用：删除旧的非 CCTV 分类文件
          rm -f output/weishi.m3u output/sports.m3u output/movies.m3u output/kids.m3u output/news.m3u output/music.m3u output/documentary.m3u output/hmt.m3u output/japan_korea.m3u output/western.m3u output/local.m3u output/others.m3u
          git add -A output/
          git diff --cached --quiet || (git commit -m "自动更新频道列表 $(date -u +%Y-%m-%d)" && git push)
